version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # one weekly PR for all crate updates instead of one PR per crate
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # release.yml is generated by cargo-dist and its `plan` job rejects any
      # drift from the pinned template, so checkout bumps there can never pass
      # CI (see PR #58); the version follows cargo-dist upgrades instead.
      # Dependabot cannot exclude a single file, so the dependency is ignored
      # ecosystem-wide — ci.yml is current and only sees rare major bumps.
      - dependency-name: "actions/checkout"
