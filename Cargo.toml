[package]
name = "docrev"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal document viewer with inline review comments, designed for AI agent workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaneko1117/docrev"
homepage = "https://github.com/kaneko1117/docrev"
readme = "README.md"
keywords = ["excel", "xlsx", "tui", "review", "agent"]
categories = ["command-line-utilities"]

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
fd-lock = "4.0.4"
quick-xml = "0.41.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
insta = "1.48.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
