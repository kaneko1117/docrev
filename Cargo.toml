[package]
name = "docrev"
version = "0.1.0"
edition = "2024"
description = "A terminal document viewer with inline review comments, designed for AI agent workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaneko1117/docrev"

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
unicode-width = "0.2.2"
